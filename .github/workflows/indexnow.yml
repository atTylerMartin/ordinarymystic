# Notify Bing (and other IndexNow-subscribed engines) of recently updated
# pages after a deploy. Vercel posts a GitHub deployment status when a
# Production deploy of tiktok-landing finishes; this runs on that success and
# submits the sitemap URLs updated in the last 3 days. See scripts/indexnow.mjs
# and the "IndexNow" section of CLAUDE.md.

name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      urls:
        description: "Specific paths or URLs to submit (space-separated). Leave blank for --sitemap --since 3."
        required: false
        type: string

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require INDEXNOW_KEY
        run: |
          if [ -z "${{ secrets.INDEXNOW_KEY }}" ]; then
            echo "::error::INDEXNOW_KEY repository secret is not set. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Submit specific URLs
        if: github.event_name == 'workflow_dispatch' && inputs.urls != ''
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs ${{ inputs.urls }}

      - name: Submit recently updated sitemap URLs
        if: github.event_name == 'deployment_status' || (github.event_name == 'workflow_dispatch' && inputs.urls == '')
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: node scripts/indexnow.mjs --sitemap --since 3
